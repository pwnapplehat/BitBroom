name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least-privilege by default; the release step opts into contents:write.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    permissions:
      contents: write # attach GitHub Release assets when building a version tag
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BitBroom.sln

      - name: Build
        run: dotnet build BitBroom.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/BitBroom.Core.Tests/BitBroom.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish (win-x64)
        run: ./build/publish.ps1 -Runtime win-x64
        shell: pwsh

      - name: Publish (win-arm64)
        run: ./build/publish.ps1 -Runtime win-arm64
        shell: pwsh

      - name: Install Inno Setup (pinned + verified)
        run: ./build/install-innosetup.ps1
        shell: pwsh

      - name: Pack release assets
        run: ./build/pack-release.ps1
        shell: pwsh

      - name: Upload artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: BitBroom-win-x64
          path: dist/win-x64/

      - name: Upload artifacts (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: BitBroom-win-arm64
          path: dist/win-arm64/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: BitBroom-release
          path: release/

      # Tag v1.2.6 (matching Directory.Build.props Version) → GitHub Release with
      # portable zips, setup.exe, and SHA256SUMS.txt. No local Windows machine required.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
